services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0.10
    container_name: mongodb
    hostname: mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=kitana
      - MONGODB_INITDB_ROOT_PASSWORD=kitana
    ports:
      - 27017:27017
    volumes:
      #- ./init:/docker-entrypoint-initdb.d
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://kitana:kitana@mongodb:27017/?directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: webadmin
      ME_CONFIG_BASICAUTH_PASSWORD: webpassword
    depends_on:
      - mongodb
volumes:
  db:
  configdb:
  mongot:
