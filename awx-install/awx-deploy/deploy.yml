apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: ansible-awx
  namespace: awx
spec:
  service_type: ClusterIP
  create_preload_data: true
  admin_user: admin
  admin_password_secret: secret-password

  # Instructs the operator to automatically deploy a managed PostgreSQL database pod
  postgres_storage_class: local-path
  projects_storage_class: local-path
  projects_storage_size: 20Gi
  projects_persistence: true

  # Attaches to k3d's built-in Traefik ingress controller
  # ingress section
  ingress_type: ingress
  ingress_class_name: nginx
  ingress_tls_secret: awx-example-tls
  hostname: awx.example.com
  ingress_annotations: |
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

  # ingress_type: Ingress
  # ingress_path: /
